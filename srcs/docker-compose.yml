services:
  mariadb:
    build: ./requirements/mariadb
    image: mariadb:inception
    container_name: mariadb
    env_file:
      - .env
    secrets:
      - db_password
      - db_root_password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - inception
    restart: unless-stopped

  wordpress:
    build: ./requirements/wordpress
    image: wordpress:inception
    container_name: wordpress
    env_file:
      - .env
    secrets:
      - db_password
      - credentials
    volumes:
      - wp_data:/var/www/html
    networks:
      - inception
    depends_on:
      - mariadb
    restart: unless-stopped

  # ⬇️ NOVO SERVIÇO
  nginx:
    build: ./requirements/nginx
    image: nginx:inception
    container_name: nginx
    env_file:
      - .env
    volumes:
      - wp_data:/var/www/html:ro
    ports:
      - "443:443" # ÚNICA porta exposta ao exterior!
    networks:
      - inception
    depends_on:
      - wordpress
    restart: unless-stopped

volumes:
  db_data:
  wp_data:

networks:
  inception:
    name: inception
    driver: bridge

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  credentials:
    file: ../secrets/credentials.txt
